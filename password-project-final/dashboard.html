<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body onload="showUser()">

<div class="container">

<h2>Password Analyzer</h2>

<h3 id="welcomeUser"></h3>

<div class="password-box">
<input type="password" id="password" placeholder="Enter password">
<span onclick="togglePassword('password')">👁</span>
</div>

<br>

<button onclick="checkStrength()">Check Strength</button>
<button onclick="generatePassword()">🤖 Generate Password</button>
<button onclick="copyPassword()">📋 Copy Password</button>

<p id="aiMsg"></p>

<h3 id="strengthText"></h3>

<canvas id="chart"></canvas>

<br>

<button onclick="toggleHistory()">📂 View Login History</button>
<button onclick="logout()">Logout</button>

</div>

<!-- SIDE PANEL -->
<div id="historyPanel" class="side-panel">
<h3>Login History</h3>
<ul id="historyList"></ul>
<button onclick="clearHistory()">Delete History</button>
<button onclick="toggleHistory()">Close</button>
</div>

<script src="script.js"></script>

</body>
</html>
